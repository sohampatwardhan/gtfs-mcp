name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protobuf and ripgrep
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler ripgrep
      - name: Reject hardcoded GTFS endpoints
        run: bash .github/scripts/check-gtfs-urls.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
