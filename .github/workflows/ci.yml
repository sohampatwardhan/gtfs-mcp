name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Versions match Cargo.toml
        run: bash scripts/check-versions.sh
      - name: Reject hardcoded GTFS endpoints
        run: bash .github/scripts/check-gtfs-urls.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items --locked
      - name: Release build
        run: cargo build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the npm launcher parses
        run: node --check npm/gtfs-mcp/bin/gtfs-mcp.js
      - name: cargo publish dry run
        run: cargo publish --dry-run --locked
